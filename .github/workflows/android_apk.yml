name: Android Build

# Builds a debug APK and publishes it to GitHub Releases.
# Required repository secrets: SUPABASE_URL, SUPABASE_KEY, ADMIN_PHONE, ADMIN_WA

on:
  workflow_dispatch:

env:
  APP_NAME: RizwanTask
  GRADLE_VERSION: '9.7.0'   # keep in sync with the AGP version in app/build.gradle.kts

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-gradle handles Gradle caching, so setup-java's `cache: gradle` is not needed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Gradle Version
        run: gradle --version

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
          ADMIN_WA: ${{ secrets.ADMIN_WA }}

      - name: Verify APK
        id: verify
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "sha256=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: build-${{ github.run_number }}
          name: ${{ env.APP_NAME }} v${{ github.run_number }} (Debug)
          body: |
            Debug Android APK.

            Build: #${{ github.run_number }}
            Commit: `${{ github.sha }}`
            SHA-256: `${{ steps.verify.outputs.sha256 }}`

            Download: app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
